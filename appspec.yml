version: 0.0
os: linux

files:

* source: /
  destination: /home/ubuntu/app

hooks:
BeforeInstall:
- location: scripts/beforeinstall.sh
timeout: 300
runas: root

AfterInstall:
- location: scripts/afterinstall.sh
timeout: 300
runas: root

ApplicationStart:
- location: scripts/startserver.sh
timeout: 300
runas: root
