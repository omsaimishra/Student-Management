steps:
  # Build backend
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/backend:$SHORT_SHA
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - tag
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/backend:$SHORT_SHA
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/backend:prod

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/backend:$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/backend:prod

  # Build frontend
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/frontend:$SHORT_SHA
      - ./frontend

  - name: gcr.io/cloud-builders/docker
    args:
      - tag
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/frontend:$SHORT_SHA
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/frontend:prod

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/frontend:$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/frontend:prod

images:
  - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/backend:prod
  - asia-south1-docker.pkg.dev/student-management-demoapp/studentartifact/frontend:prod
options:
  logging: CLOUD_LOGGING_ONLY

