steps:
  # 1. Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/backend:latest
      - ./backend

  # 2. Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/frontend:latest
      - ./frontend

  # 3. Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/backend:latest

  # 4. Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/frontend:latest
  # 5. Trigger VM Deployment (Metadata Update)
  - name: 'gcloud'
    id: 'trigger-deploy'
    waitFor: ['push-backend', 'push-frontend']
    args:
      - 'compute'
      - 'instances'
      - 'add-metadata'
      - 'student-vm-private-1'      # Replace with your VM name
      - '--metadata'
      - 'deploy_id=$BUILD_ID'
      - '--zone'
      - 'asia-south1-a'     # Replace with your VM zone

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/backend:latest
  - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/frontend:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"

