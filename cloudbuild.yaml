steps:
  # 1. Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/meanrev-student-demo-prod/backend:v1.3.9
      - ./backend

  # 2. Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/meanrev-student-demo-prod/frontend:v1.3.9
      - ./frontend

  # 3. Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/meanrev-student-demo-prod/backend:v1.3.9

  # 4. Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/meanrev-student-demo-prod/frontend:v1.3.9

  # 5. Trigger VM Deployment (Metadata Update)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'trigger-deploy'
    waitFor: ['push-backend', 'push-frontend']
    entrypoint: bash
    args:
      - -c
      - |
        gcloud compute instances add-metadata student-vm-private-1 \
          --zone asia-south1-a \
          --metadata deploy_id=$BUILD_ID

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/meanrev-student-demo-prod/backend:v1.3.9
  - asia-south1-docker.pkg.dev/$PROJECT_ID/meanrev-student-demo-prod/frontend:v1.3.9

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"


