steps:
  # 1. Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/backend:latest
      - ./backend

  # 2. Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/frontend:latest
      - ./frontend

  # 3. Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/backend:latest

  # 4. Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/frontend:latest

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/backend:latest
  - asia-south1-docker.pkg.dev/$PROJECT_ID/studentartifact/frontend:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: "1200s"

