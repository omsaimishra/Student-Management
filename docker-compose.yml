version: "3.8"

services:
  backend:
    image: 143262365667.dkr.ecr.ap-south-1.amazonaws.com/dev-student-demo-repo:backend-v1
    container_name: backend
    ports:
      - "5000:5000"
    restart: always

  frontend:
    image: 143262365667.dkr.ecr.ap-south-1.amazonaws.com/dev-student-demo-repo:frontend-v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    volumes:
      - app_mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: studentpass
      MYSQL_DATABASE: studentdb
      MYSQL_USER: student
      MYSQL_PASSWORD: studentpass

volumes:
  app_mysql-data:
